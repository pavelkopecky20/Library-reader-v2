{% extends "base.html" %}

{% block title %}Upravit knihy – Library Reader{% endblock %}

{% block content %}
<div class="edit-section">
    <h2>Upravit záznamy</h2>

    <form method="POST">
        <div class="edit-table-wrap">
            <table class="edit-table">
                <thead>
                    <tr>
                        <th>Název knihy</th>
                        <th>Autor</th>
                        <th>Přečteno</th>
                        <th>Hodnocení</th>
                        <th>Abstrakt</th>
                        <th>Komentář</th>
                    </tr>
                </thead>
                <tbody>
                    {% for book in books %}
                    <tr>
                        <td><input type="text" name="title_{{ book.id }}" value="{{ book.title }}"></td>
                        <td><input type="text" name="author_{{ book.id }}" value="{{ book.author }}"></td>
                        <td style="text-align:center"><input type="checkbox" name="is_read_{{ book.id }}" {% if book.is_read %}checked{% endif %}></td>
                        <td><input type="number" name="rating_{{ book.id }}" value="{{ book.rating or '' }}" min="1" max="10" placeholder="1–10"></td>
                        <td><textarea name="abstract_{{ book.id }}">{{ book.abstract or '' }}</textarea></td>
                        <td><textarea name="comment_{{ book.id }}">{{ book.comment or '' }}</textarea></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div style="display:flex; gap:12px; align-items:center">
            <input type="submit" value="Uložit změny" class="btn btn-primary" style="width:auto; border-radius:50px; font-size:0.95rem; padding:12px 28px;">
            <a href="{{ url_for('books') }}" class="btn btn-secondary">Zpět na seznam</a>
        </div>
    </form>
</div>
{% endblock %}
