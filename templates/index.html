{% extends "base.html" %}

{% block title %}Library Reader – Nahrát knihy{% endblock %}

{% block content %}
<div class="upload-section">
    <h2>Vyfotografuj své knihy</h2>
    <p class="subtitle">
        Nahraj fotku hřbetů knih a aplikace automaticky rozpozná názvy a autory.
    </p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <div class="upload-card">
        <form id="uploadForm" method="POST" enctype="multipart/form-data">
            <div class="file-input-wrapper">
                <label for="image" class="file-label">
                    <span class="icon">📷</span>
                    <span>Klikni pro výběr fotky</span>
                    <span style="font-size:0.8rem">JPG, PNG – max. 4 MB</span>
                </label>
                <input type="file" name="image" id="image" accept="image/*">
            </div>
            <span id="fileStatus">Žádný soubor nevybrán</span>
            <input type="submit" value="Rozpoznat knihy">
        </form>
    </div>
</div>

<script>
    document.getElementById('image').addEventListener('change', (event) => {
        const fileStatus = document.getElementById('fileStatus');
        const files = event.target.files;
        if (files.length > 0) {
            fileStatus.textContent = files[0].name;
            fileStatus.classList.add('selected');
        } else {
            fileStatus.textContent = 'Žádný soubor nevybrán';
            fileStatus.classList.remove('selected');
        }
    });

    document.getElementById('uploadForm').addEventListener('submit', (event) => {
        const file = document.getElementById('image').files[0];
        if (!file) {
            alert('Vyberte prosím soubor.');
            event.preventDefault();
            return;
        }
        if (file.size / (1024 * 1024) > 4) {
            alert('Soubor je příliš velký. Maximální velikost je 4 MB.');
            event.preventDefault();
        }
    });
</script>
{% endblock %}
